version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      android:
        patterns:
          - "androidx.*"
      compose:
        patterns:
          - "androidx.compose*"
      room:
        patterns:
          - "androidx.room*"
      testing:
        patterns:
          - "androidx.test*"
          - "junit*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      serialization:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-serialization*"
      gradle:
        patterns:
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: ["2.1.0", "2.1.10"]  # wait for stable

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"