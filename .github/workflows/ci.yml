name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          ndk-version: r27c
          cmake-version: 3.22.1
          build-tools-version: 35.0.1
          platform-tools-version: latest

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Offline gate — production manifest must not request INTERNET
        run: |
          if grep -q "INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ INTERNET permission found in production manifest"
            exit 1
          fi
          echo "✅ No INTERNET permission"

      - name: Ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release (unsigned in CI)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Release job — only runs on tagged commits AND when signing secrets are available
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'ganeshgawali2007-arch/Scrappy_DataCollector'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          ndk-version: r27c
          cmake-version: 3.22.1
          build-tools-version: 35.0.1
          platform-tools-version: latest

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Check signing secrets available
        id: check_secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "secrets_missing=true" >> $GITHUB_OUTPUT
            echo "⚠️ Signing secrets not configured — skipping signed release"
          else
            echo "secrets_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure release signing
        if: steps.check_secrets.outputs.secrets_missing == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/scrappy-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/scrappy-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release
        if: steps.check_secrets.outputs.secrets_missing == 'false'
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release
        if: steps.check_secrets.outputs.secrets_missing == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: steps.check_secrets.outputs.secrets_missing == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip release — secrets not configured
        if: steps.check_secrets.outputs.secrets_missing == 'true'
        run: |
          echo "⏭️ Skipping signed release — configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in repo secrets to enable"